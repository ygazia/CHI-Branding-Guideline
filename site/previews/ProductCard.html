<!doctype html>
<html lang="en"><head><link rel="stylesheet" href="../tokens.css"><script>try{document.documentElement.dataset.theme=parent.document.documentElement.dataset.theme||"light"}catch(e){}</script><meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);color:var(--ink);background:var(--surface);padding:24px;font-size:13px;line-height:18px}
.logo{display:block;width:100%;height:auto;overflow:visible}
.lr{fill:var(--chi-red)}.lk{fill:var(--chi-black)}
.on-dark .lk{fill:var(--chi-white)}
.all-white .lr,.all-white .lk{fill:var(--chi-white)}
.all-black .lr,.all-black .lk{fill:var(--chi-black)}
.cap{font:500 11px/16px var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin:8px 0 0}
.g-white{background:var(--chi-white)}.g-red{background:var(--chi-red)}.g-black{background:var(--chi-black)}.g-silk{background:var(--silk)}
.edge{outline:1px solid var(--line);outline-offset:-1px}
</style>
</head><body>
<style>
.r{display:flex;flex-wrap:wrap;gap:24px}
.c{flex:0 1 264px;min-width:0;background:var(--surface-raised);display:flex;flex-direction:column}
.img{aspect-ratio:4/5;background:var(--surface-sunken);display:grid;place-items:center;color:var(--ink-muted);font:500 11px/16px var(--font-sans);letter-spacing:.14em;text-transform:uppercase}
.t{padding:24px;display:grid;gap:8px}
.ln{margin:0;font:500 13px/16px var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
h3{margin:0;font:700 22px/28px var(--font-sans);text-wrap:balance}
.mt{margin:0;color:var(--ink-muted)}
.bs{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.bd{font:500 11px/16px var(--font-sans);letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;border:1px solid var(--ink)}
.btn{font:600 16px/26px var(--font-sans);padding:11px 24px;border:0;border-radius:var(--radius-none);background:var(--brand);color:var(--on-brand);cursor:pointer}
.btn:hover{background:var(--brand-strong)}.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
