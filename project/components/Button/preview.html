<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{font-family:var(--font-sans);color:var(--ink);background:var(--surface);padding:24px;font-size:13px;line-height:18px}
.logo{display:block;width:100%;height:auto;overflow:visible}
.lr{fill:var(--chi-red)}.lk{fill:var(--chi-black)}
.on-dark .lk{fill:var(--chi-white)}
.all-white .lr,.all-white .lk{fill:var(--chi-white)}
.all-black .lr,.all-black .lk{fill:var(--chi-black)}
.cap{font:500 11px/16px var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin:8px 0 0}
.g-white{background:var(--chi-white)}.g-red{background:var(--chi-red)}.g-black{background:var(--chi-black)}.g-silk{background:var(--silk)}
.edge{outline:1px solid var(--line);outline-offset:-1px}
</style>
</head><body>
<style>
.r{display:flex;flex-wrap:wrap;gap:16px;align-items:center}
.btn{font:600 16px/26px var(--font-sans);padding:11px 24px;border:1px solid transparent;border-radius:var(--radius-none);cursor:pointer;background:none;color:var(--ink);text-decoration:none;display:inline-block}
.btn:focus-visible,.btn.is-focus{outline:2px solid var(--focus);outline-offset:2px}
.pri{background:var(--brand);color:var(--on-brand)}.pri:hover,.pri.is-hover{background:var(--brand-strong)}
.sec{border-color:var(--ink)}.sec:hover{background:var(--ink);color:var(--surface)}
.txt{padding-left:0;padding-right:0;color:var(--brand-text);text-decoration:underline;text-underline-offset:4px}
.btn[disabled]{background:var(--surface-sunken);border-color:var(--line);color:var(--ink-muted);cursor:not-allowed}
.cap{margin-top:16px}
</style>
<div class="r">
<button class="btn pri" type="button">Add to bag</button>
<button class="btn pri is-hover" type="button">Hover</button>
<button class="btn pri is-focus" type="button">Focus</button>
<button class="btn sec" type="button">Find a salon</button>
<a class="btn txt" href="#">How to use</a>
<button class="btn pri" type="button" disabled>Sold out</button>
</div>
<p class="cap">Primary &middot; hover &middot; focus &middot; secondary &middot; text link &middot; disabled</p>
</body></html>
