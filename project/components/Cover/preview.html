<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--surface);color:var(--ink);font-family:var(--font-sans)}
.cover{position:relative;width:960px;height:300px;overflow:hidden}
.cover svg{position:absolute;inset:0;display:block}
.txt{position:absolute;left:32px;bottom:32px;max-width:440px}
.name{margin:0;font-weight:900;font-size:64px;line-height:61px;letter-spacing:-.02em}
.tag{margin:16px 0 0;font-size:14px;line-height:18px;color:var(--ink-muted)}
.brand{fill:var(--brand)}.ink{fill:var(--ink)}.silk{fill:var(--silk)}.ground{fill:var(--surface)}
.lo{fill:var(--heat-low)}.mi{fill:var(--heat-mid)}.hi{fill:var(--heat-high)}
</style></head><body>
<div class="cover">
<!--
blocks: brand 240x300 slab; ink 144x192; silk 144x108; heat-low, heat-mid, heat-high 48x48 each (space-12 squares).
arrangement: one tall red slab bleeding top and bottom, black and silk stacked flush to its right and bleeding off the right edge, the heat scale as three small steps flush to its left foot.
pattern: bars in the proportion of the wordmark's I (space-8 x space-24, 1:3), cut from the slab in the ground colour and from the ink block in brand; chosen because the README says the brand's shapes are "solid rectangles, hard edges, strong vertical bars" taken from the H and I and from ceramic plates.
scales: space-8 (32), space-4 gaps (16), space-12 (48), space-24 (96); radius-none throughout.
-->
<svg width="960" height="300" viewBox="0 0 960 300" aria-hidden="true">
<rect class="brand" x="576" y="0" width="240" height="300"/>
<rect class="ink" x="816" y="0" width="144" height="192"/>
<rect class="silk" x="816" y="192" width="144" height="108"/>
<rect class="lo" x="528" y="156" width="48" height="48"/>
<rect class="mi" x="528" y="204" width="48" height="48"/>
<rect class="hi" x="528" y="252" width="48" height="48"/>
<rect class="ground" x="624" y="48" width="32" height="96"/>
<rect class="ground" x="672" y="48" width="32" height="96"/>
<rect class="ground" x="720" y="48" width="32" height="96"/>
<rect class="brand" x="848" y="48" width="32" height="96"/>
<rect class="brand" x="896" y="48" width="32" height="96"/>
</svg>
<div class="txt"><p class="name">CHI Brand<br>Guidelines</p><p class="tag">Red, black and white. Heavy and light. Heat and care.</p></div>
</div>
</body></html>
